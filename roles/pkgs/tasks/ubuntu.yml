---
- name: Configure Aliyun apt repositories (deb822)
  copy:
    dest: /etc/apt/sources.list.d/ubuntu.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://mirrors.aliyun.com/ubuntu/
      Suites: {{ ansible_facts.distribution_release }} {{ ansible_facts.distribution_release }}-updates {{ ansible_facts.distribution_release }}-backports {{ ansible_facts.distribution_release }}-security
      Components: main restricted universe multiverse
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

- name: Remove legacy sources.list
  file:
    state: absent
    path: /etc/apt/sources.list

- name: Make apt cache
  apt:
    update_cache: yes

- name: Install common packages
  apt:
    name: "{{ packages }}"
  vars:
    packages:
      - vim
      - net-tools
      - telnet
