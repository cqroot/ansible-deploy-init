---
- name: Configure chrony
  copy:
    dest: /etc/chrony.conf
    mode: "0644"
    content: |
      # Managed by Ansible, do not edit manually.
      {% for server in chrony_servers %}
      server {{ server }} iburst
      {% endfor %}
      driftfile /var/lib/chrony/drift
      makestep 1.0 3
      rtcsync

- name: Start and enable chronyd
  systemd:
    name: chronyd
    state: started
    enabled: yes
